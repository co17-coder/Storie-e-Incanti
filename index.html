<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storie e Incanti — Copia zero</title>
<meta name="description" content="Storie e Incanti — fiabe e favole per chi vuole sognare. Copia zero, certificata 23/11/2026.">
<meta property="og:title" content="Storie e Incanti — Copia zero">
<meta property="og:description" content="Fiabe e favole per chi vuole sognare.">
<meta property="og:image" content="assets/copertina.jpg">
<link rel="preload" as="image" href="assets/copertina.jpg">
<link rel="preload" as="image" href="assets/quarta.jpg">
<link rel="preload" as="image" href="assets/dorso.jpg">
<style>
  /* ------------------------------------------------------------------
     Tavola di progetto: 1080 x 1920 px (come il PDF).
     Libro: copertina 14.81 x 21.0 cm (rifilo del template KDP), dorso 1.1 cm.
     Nel layout la copertina occupa 762 x 1081 px  ->  51.4 px/cm
     Spessore 1.1 cm -> 56 px
     ------------------------------------------------------------------ */
  :root{
    --W: 762px;          /* larghezza copertina */
    --H: 1081px;         /* altezza copertina   */
    --D: 56px;           /* spessore dorso (1.1 cm in scala) */
    --x: 157.6px;        /* posizione nel layout originale */
    --y: 421.18px;  /* centrato tra le due fasce: 25.4 px sopra e sotto */
    --spine: #354a65;    /* blu del dorso, usato anche per i bordi dei tagli */
    --paper: #efe6d2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#8fa9ab}
  body{display:grid;place-items:center}

  /* sfondo oltre il 9:16 su schermi larghi */
  .backdrop{
    position:fixed;inset:-40px;
    background:url(assets/sfondo.jpg) center/cover no-repeat;
    filter:blur(28px) saturate(.9) brightness(.92);
  }

  .stage{
    position:absolute;left:50%;top:50%;
    width:1080px;height:1920px;
    transform-origin:0 0;
    background:url(assets/sfondo.jpg) 0 0/1080px 1920px no-repeat;
    box-shadow:0 0 60px rgba(0,0,0,.25);
    overflow:hidden;
    opacity:0;transition:opacity .6s ease;
  }
  .stage.ready{opacity:1}

  .scene{
    position:absolute;inset:0;
    perspective:2800px;
    perspective-origin:538.7px 961.68px; /* centro del libro */
  }
  .book{
    position:absolute;left:var(--x);top:var(--y);
    width:var(--W);height:var(--H);
    transform-style:preserve-3d;
    will-change:transform;
  }
  .face{
    position:absolute;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .face img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
  .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
  .gloss{
    position:absolute;inset:-10% -60%;pointer-events:none;opacity:0;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
    mix-blend-mode:soft-light;
  }

  .front {width:var(--W);height:var(--H);transform:translateZ(calc(var(--D)/2))}
  .back  {width:var(--W);height:var(--H);transform:rotateY(180deg) translateZ(calc(var(--D)/2))}

  /* dorso a sinistra guardando la copertina */
  .spine{
    width:var(--D);height:var(--H);left:calc((var(--W) - var(--D))/2);
    transform:rotateY(-90deg) translateZ(calc(var(--W)/2));
    background:
      linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.05) 30%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.18)),
      url(assets/dorso.jpg) 0 0/100% 100% no-repeat,
      var(--spine);
  }
  /* taglio pagine (lato destro) */
  .edge{
    width:var(--D);height:var(--H);left:calc((var(--W) - var(--D))/2);
    transform:rotateY(90deg) translateZ(calc(var(--W)/2));
    background:
      linear-gradient(90deg,var(--spine) 0 1.5px,transparent 1.5px calc(100% - 1.5px),var(--spine) 0),
      repeating-linear-gradient(90deg,rgba(120,100,70,.18) 0 .6px,transparent .6px 2.2px),
      var(--paper);
  }
  .top,.bottom{
    width:var(--W);height:var(--D);top:calc((var(--H) - var(--D))/2);
    background:
      linear-gradient(0deg,var(--spine) 0 1.5px,transparent 1.5px calc(100% - 1.5px),var(--spine) 0),
      linear-gradient(90deg,var(--spine) 0 3px,transparent 3px),
      repeating-linear-gradient(0deg,rgba(120,100,70,.18) 0 .6px,transparent .6px 2.2px),
      var(--paper);
  }
  .top   {transform:rotateX(90deg)  translateZ(calc(var(--H)/2))}
  .bottom{transform:rotateX(-90deg) translateZ(calc(var(--H)/2))}

  /* scritte sopra al libro, come nel file originale */
  .labels{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:url(assets/scritte.png) 0 0/1080px 1920px no-repeat;
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="stage" id="stage" role="img"
        aria-label="Storie e Incanti, di Maggie G.: il libro ruota mostrando copertina e quarta di copertina. Copia zero, certificata 23/11/2026.">
    <div class="scene">
      <div class="book" id="book">
        <div class="face front"><img src="assets/copertina.jpg" alt=""><div class="gloss"></div><div class="shade"></div></div>
        <div class="face back"><img src="assets/quarta.jpg" alt=""><div class="gloss"></div><div class="shade"></div></div>
        <div class="face spine"><div class="shade"></div></div>
        <div class="face edge"><div class="shade"></div></div>
        <div class="face top"><div class="shade"></div></div>
        <div class="face bottom"><div class="shade"></div></div>
      </div>
    </div>
    <div class="labels"></div>
  </main>

<script>
(() => {
  /* ---------------- impostazioni animazione ---------------- */
  const HOLD_FRONT = 1.6;  // s di pausa sulla copertina
  const TURN       = 2.6;  // s per mezzo giro (180°)
  const HOLD_BACK  = 3.0;  // s di pausa sulla quarta (tempo per leggere)
  /* --------------------------------------------------------- */

  const stage  = document.getElementById('stage');
  const book   = document.getElementById('book');

  // normale di ogni faccia (sistema CSS: y verso il basso, z verso chi guarda)
  const faces = [
    ['.front',  [0, 0, 1]],
    ['.back',   [0, 0,-1]],
    ['.spine',  [-1,0, 0]],
    ['.edge',   [1, 0, 0]],
    ['.top',    [0,-1, 0]],
    ['.bottom', [0, 1, 0]],
  ].map(([sel, n]) => {
    const el = book.querySelector(sel);
    return { n, shade: el.querySelector('.shade'), gloss: el.querySelector('.gloss') };
  });

  // luce da davanti, in alto a sinistra
  const L = (() => { const v = [-0.45, -0.35, 1]; const m = Math.hypot(...v); return v.map(c => c / m); })();
  const AMB = 0.42;
  const lum = d => AMB + (1 - AMB) * Math.max(0, d);
  const REST = lum(L[2]);  // luminosità della copertina a riposo -> resta identica all'originale

  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const CYCLE = 2 * (TURN) + HOLD_FRONT + HOLD_BACK;

  function angleAt(t) {
    t %= CYCLE;
    if (t < HOLD_FRONT) return 0;
    t -= HOLD_FRONT;
    if (t < TURN) return 180 * ease(t / TURN);
    t -= TURN;
    if (t < HOLD_BACK) return 180;
    t -= HOLD_BACK;
    return 180 + 180 * ease(t / TURN);
  }

  function render(deg) {
    const a = deg * Math.PI / 180, s = Math.sin(a), c = Math.cos(a);
    book.style.transform = `rotateY(${deg}deg)`;

    for (const f of faces) {
      const [nx, ny, nz] = f.n;
      const x = nx*c + nz*s, y = ny, z = -nx*s + nz*c;      // normale ruotata
      const b = Math.min(1, lum(x*L[0] + y*L[1] + z*L[2]) / REST);
      f.shade.style.opacity = (1 - b).toFixed(3);
      if (f.gloss) {
        const k = Math.abs(s);                              // riflesso solo in movimento
        f.gloss.style.opacity = (k * 0.9).toFixed(3);
        f.gloss.style.transform = `translateX(${(s * 45).toFixed(1)}%)`;
      }
    }
  }

  function fit() {
    const k = Math.min(innerWidth / 1080, innerHeight / 1920);
    stage.style.transform = `scale(${k}) translate(-540px,-960px)`;
  }
  addEventListener('resize', fit); fit();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = null, paused = false, pausedAt = 0;

  function frame(now) {
    if (t0 === null) t0 = now;
    if (!paused) render(angleAt((now - t0) / 1000));
    requestAnimationFrame(frame);
  }

  // clic / tap: pausa e ripresa
  stage.addEventListener('click', () => {
    const now = performance.now();
    if (paused) { t0 += now - pausedAt; paused = false; }
    else { pausedAt = now; paused = true; }
  });

  const imgs = [...book.querySelectorAll('img')];
  Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve()))
    .then(() => {
      // ?angolo=45 -> libro fermo a quell'angolo (utile per screenshot)
      const fixed = new URLSearchParams(location.search).get('angolo');
      render(fixed !== null ? +fixed : 0);
      stage.classList.add('ready');
      if (!reduce && fixed === null) requestAnimationFrame(frame);
    });
})();
</script>
</body>
</html>
